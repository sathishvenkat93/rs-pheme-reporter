[project]
name = "pheme-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.2",
    "fastexcel>=0.21.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "minio>=7.2.20",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "rq>=3.0.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
    "xlsxwriter>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]
ignore = ["S101", "S608", "E501"]  # line length is left to `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"tests/conftest.py" = ["E402"]  # test env must be set before app imports

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.models.*", "app.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (run with make test-slow)"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
